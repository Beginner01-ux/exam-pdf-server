name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 2 hours to keep the app warm and avoid sleep mode
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  wake-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Open App and Wait for Full Boot
        run: |
          node -e '
          const puppeteer = require("puppeteer");
          (async () => {
            const browser = await puppeteer.launch({ 
              headless: "new",
              args: ["--no-sandbox", "--disable-setuid-sandbox"]
            });
            const page = await browser.newPage();
            
            // Set user agent so Streamlit maintains active WebSocket connections
            await page.setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36");
            
            // Exam PDF Access App URL
            const url = "https://exam-pdf-access-system-5rmr3rmpmnexhskp5tbsaw.streamlit.app/";
            
            console.log("Navigating to app...");
            await page.goto(url, { waitUntil: "networkidle2", timeout: 90000 });
            
            // Look for the "Wake up" button
            const wakeButton = await page.$("button");
            
            if (wakeButton) {
              const text = await page.evaluate(el => el.textContent, wakeButton);
              if (text && text.includes("Yes, get this app back up")) {
                console.log("Wake up button found! Clicking it...");
                await wakeButton.click();
                
                // WAIT for the wake-up screen to disappear completely (up to 90s)
                console.log("Waiting for app to complete boot sequence...");
                await page.waitForFunction(
                  () => !document.body.innerText.includes("This app has gone to sleep"),
                  { timeout: 90000 }
                );
                
                // Extra safety delay for WebSocket to register active session
                await new Promise(r => setTimeout(r, 10000));
                console.log("App successfully woken up and live!");
              } else {
                console.log("App was already awake!");
              }
            } else {
              console.log("App active!");
            }
            
            await browser.close();
          })();
          '
