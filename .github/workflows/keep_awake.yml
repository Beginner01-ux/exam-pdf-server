name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 2 hours to keep the app warm and prevent sleep mode
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  wake-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Open App and Wait for Full Boot
        run: |
          node -e '
          const puppeteer = require("puppeteer");
          (async () => {
            let browser;
            try {
              console.log("Launching browser...");
              browser = await puppeteer.launch({ 
                headless: "new",
                args: [
                  "--no-sandbox", 
                  "--disable-setuid-sandbox",
                  "--disable-dev-shm-usage",
                  "--disable-gpu"
                ]
              });
              
              const page = await browser.newPage();
              await page.setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36");
              
              // Exam PDF Access System URL
              const url = "https://exam-pdf-access-system-5rmr3rmpmnexhskp5tbsaw.streamlit.app/";
              
              console.log("Navigating to URL...");
              await page.goto(url, { waitUntil: "networkidle0", timeout: 60000 });
              
              // Wait 5 seconds for Streamlit JavaScript JSbundle to initialize
              await new Promise(r => setTimeout(r, 5000));
              
              // Search page HTML directly for the wake-up button text
              const content = await page.content();
              
              if (content.includes("Yes, get this app back up")) {
                console.log("App is sleeping! Finding button to click...");
                
                // Click any button containing the wakeup text
                const clicked = await page.evaluate(() => {
                  const buttons = Array.from(document.querySelectorAll("button"));
                  const target = buttons.find(b => b.textContent.includes("Yes, get this app back up"));
                  if (target) {
                    target.click();
                    return true;
                  }
                  return false;
                });
                
                if (clicked) {
                  console.log("Wake up button clicked successfully! Waiting 45s for container boot...");
                  await new Promise(r => setTimeout(r, 45000));
                }
              } else {
                console.log("App is already active and awake!");
                await new Promise(r => setTimeout(r, 5000));
              }
              
            } catch (err) {
              console.error("Execution error:", err);
              process.exit(1);
            } finally {
              if (browser) await browser.close();
            }
          })();
          '
